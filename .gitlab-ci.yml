include:
  - project: 'tech/templates'
    ref: $GLOBAL_REF_TEMPLATE
    file: 'maven.template.yaml'

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /master/
      variables:
        ENVIRONMENT: "uat"
    - if: $CI_PIPELINE_SOURCE =~ /web|pipeline/

variables:
  ENVIRONMENT:
    value:
      "uat"
    options:
      - "test"
      - "uat"
      - "int"
    description:
      "Выберите целевой контур из списка (должны быть описаны в секции <profiles> файла pom.xml)"
  TEST_SCRIPT:
    value:
      ""
    options:
      - ""
      - "Системные"
      - "Ручной ввод"
      - "Загрузка через XML"
    description:
      "Выберите группу тестов из списка или оставьте пустым для запуска всех тестов профиля"
  TEST_ARTIFACTS: "target"
  REPORT_ARTIFACTS: "build"
  DIR_NOTIFICATION: "notifications"
  BROWSERS:
    value:
      "browser_chrome_remote"
    options:
      - "browser_chrome_remote"
      - "browser_firefox_remote"
      - "browser_yandex_remote"
      - "moon_chrome_browser"
    description:
      "Выберите целевой браузер из списка. Для GitLab CI используются только удаленные профили (browser_chrome_remote, browser_firefox_remote, browser_yandex_remote, moon_chrome_browser). Локальные профили (browser_chrome_local, browser_firefox_local) доступны только для локального запуска."
  LK_SCOPE:
    value:
      ""
    options:
      - ""
      - "ЛК Архива"
      - "ЛК Страхователя"
      - "Все ЛК"
    description:
      "Выберите ЛК для тестирования. Пустое значение = текущее поведение (TEST_SCRIPT)"
  REPORT_DIR_NAME: "allure-results"
  SUITE: ""
  HELM_NAMESPACE: ""

print variables:
  stage: .pre
  script:
    - echo $CI_JOB_STARTED_AT
    - echo $GITLAB_USER_NAME
    - echo $CI_COMMIT_BRANCH
    - echo $ENVIRONMENT
    - echo $TEST_SCRIPT
    - echo $BROWSERS
    - echo $LK_SCOPE
    - echo $SUITE
    - echo $HELM_NAMESPACE
    - echo $FORWARDED_HELM_NAMESPACE

maven build:
  artifacts:
    name: maven build
    paths:
      - "${TEST_ARTIFACTS}"

maven test:
  image:
    name: "harbor.bft.local/library/base-images/maven:0.1.0-kubectl-2023.04.28"
  #  variables:
  #    CI_DEBUG_TRACE: "true"
  allow_failure: true
  timeout: 16h
  services:
    - name: selenium/standalone-chrome:latest
      alias: chrome
    - name: selenium/standalone-firefox:latest
      alias: firefox
  variables:
    SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    SE_NODE_MAX_SESSIONS: "4"
    # Настройка расширения КриптоПРО для удаленного запуска
    # Вариант 2: Использование путей к файлам расширения из репозитория
    CRYPTOPRO_PATH: "src/test/resources/CryptoPro Chrome 1.2.13.0.crx"
    CRYPTOPRO_XPI_PATH: "src/test/resources/cryptopro.ru.xpi"
    # Альтернативно: можно установить переменную CRYPTOPRO_BASE64 в настройках GitLab CI
    # (Settings → CI/CD → Variables) со значением base64-кодированного файла расширения
  script:
    - curl -X GET http://chrome:4444/status || echo "Selenium Grid не доступен, но продолжаем выполнение"
    # Проверка наличия файлов расширения КриптоПРО
    - |
      if [ -f "${CRYPTOPRO_PATH}" ]; then
        echo "✓ Файл расширения Chrome найден: ${CRYPTOPRO_PATH}"
        ls -lh "${CRYPTOPRO_PATH}"
      else
        echo "⚠ Файл расширения Chrome не найден: ${CRYPTOPRO_PATH}"
      fi
    - |
      if [ -f "${CRYPTOPRO_XPI_PATH}" ]; then
        echo "✓ Файл расширения Firefox найден: ${CRYPTOPRO_XPI_PATH}"
        ls -lh "${CRYPTOPRO_XPI_PATH}"
      else
        echo "⚠ Файл расширения Firefox не найден: ${CRYPTOPRO_XPI_PATH}"
      fi
    - |
      if [ -n "${FORWARDED_HELM_NAMESPACE}" ]; then
        HELM_NAMESPACE=${FORWARDED_HELM_NAMESPACE};
      fi
      if [ -n "${HELM_NAMESPACE}" ]
      then
        case $HELM_NAMESPACE in
          *-test|*-gtest)
            ENVIRONMENT_OVERRIDE=test
            ;;
          *-uat|*-guat)
            ENVIRONMENT_OVERRIDE=uat
            ;;
          *-int|*-gint)
            ENVIRONMENT_OVERRIDE=int
            ;;
          *-prod)
            ENVIRONMENT_OVERRIDE=prod
            ;;
          *|*-dev)
            ENVIRONMENT_OVERRIDE=dev
            ;;
        esac
        #MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${TEST_SCRIPT}","${BROWSERS}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
        ARCHIVE_TESTS="ArchivesTest#createRequestInRPU,ArchivesTest#addIspolnitel,ArchivesTest#processRequestInEVS,ArchivesTest#createNewRequestFullFlow"
        EXCLUDE_GROUPS=""

        if [ "${LK_SCOPE}" = "ЛК Архива" ]; then
          echo "LK_SCOPE: ЛК Архива — запуск только тестов архива"
          TEST_LIST="${ARCHIVE_TESTS}"
          MAVEN_PROFILE=""
          if [ "${ENVIRONMENT_OVERRIDE}" = "test" ]; then
            EVS_UI_TYPE_OVERRIDE="EVS_TEST_LKA"
          else
            EVS_UI_TYPE_OVERRIDE="EVS_UAT_LKA"
          fi
        else
          EVS_UI_TYPE_OVERRIDE=""
          if [ "${LK_SCOPE}" = "ЛК Страхователя" ]; then
            echo "LK_SCOPE: ЛК Страхователя — исключаем тесты архива"
            EXCLUDE_GROUPS="archive"
          fi

          # Определяем список тестов для группы TEST_SCRIPT
          if [ -n "${TEST_SCRIPT}" ]
          then
            case "${TEST_SCRIPT}" in
              "Системные")
                TEST_LIST="CryptoProCertificateTest#verifyCryptoProPluginLoaded,CryptoProCertificateTest#testCertificateSelectionAndSigning,CryptoProCertificateTest#testPageDiagnostics,CryptoProCertificateTest#verifyCryptoProPluginWithStrategy,CryptoProCertificateTest#quickPluginCheck"
                ;;
              "Ручной ввод")
                TEST_LIST="Efs1#efs_szv_td,Efs1#efs_szv_staj,Efs1#efs_szv_td_krivonosov,Szv_td#szv_td,Szv_m#szv_m"
                ;;
              "Загрузка через XML")
                TEST_LIST="ReportXmlUploadTest#uploadReportViaXml,Efs1#efs_1_xml_krivonosov,Efs1#efs_1_xml_babkina,Szv_ish#szv_ish_xml"
                ;;
              *)
                TEST_LIST=""
                MAVEN_PROFILE="${TEST_SCRIPT}"
                ;;
            esac
          else
            TEST_LIST=""
            MAVEN_PROFILE=""
          fi

          # Если "Все ЛК", добавляем тесты архива к выбранным
          if [ "${LK_SCOPE}" = "Все ЛК" ] && [ -n "${TEST_LIST}" ]; then
            TEST_LIST="${TEST_LIST},${ARCHIVE_TESTS}"
          fi
        fi
      
        # Формируем команду Maven
        if [ -n "${TEST_LIST}" ]
        then
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dtest="${TEST_LIST}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dtest="${TEST_LIST}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        elif [ -n "${MAVEN_PROFILE}" ]
        then
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${MAVEN_PROFILE}","${BROWSERS}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${MAVEN_PROFILE}","${BROWSERS}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        else
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        fi

        # Исключаем группу archive для "ЛК Страхователя"
        if [ -n "${EXCLUDE_GROUPS}" ]; then
          MVN="${MVN} -DexcludedGroups=${EXCLUDE_GROUPS}"
        fi
        # Для ЛК Архива подставляем evs.ui.type=LKA (переопределяет профиль uat/test)
        if [ -n "${EVS_UI_TYPE_OVERRIDE}" ]; then
          MVN="${MVN} -Devs.ui.type=${EVS_UI_TYPE_OVERRIDE}"
        fi

        KUBE_CMD="kubectl port-forward --kubeconfig=/tmp/"${ENVIRONMENT_OVERRIDE}"-user.yaml --namespace="
      elif [ -z "${HELM_NAMESPACE}" ]
      then
        # Используем ENVIRONMENT напрямую, если HELM_NAMESPACE не установлен
        ENVIRONMENT_OVERRIDE="${ENVIRONMENT}"
        echo "Using ENVIRONMENT=${ENVIRONMENT_OVERRIDE} (HELM_NAMESPACE is empty)"
        
        ARCHIVE_TESTS="ArchivesTest#createRequestInRPU,ArchivesTest#addIspolnitel,ArchivesTest#processRequestInEVS,ArchivesTest#createNewRequestFullFlow"
        EXCLUDE_GROUPS=""

        if [ "${LK_SCOPE}" = "ЛК Архива" ]; then
          echo "LK_SCOPE: ЛК Архива — запуск только тестов архива"
          TEST_LIST="${ARCHIVE_TESTS}"
          MAVEN_PROFILE=""
          if [ "${ENVIRONMENT_OVERRIDE}" = "test" ]; then
            EVS_UI_TYPE_OVERRIDE="EVS_TEST_LKA"
          else
            EVS_UI_TYPE_OVERRIDE="EVS_UAT_LKA"
          fi
        else
          EVS_UI_TYPE_OVERRIDE=""
          if [ "${LK_SCOPE}" = "ЛК Страхователя" ]; then
            echo "LK_SCOPE: ЛК Страхователя — исключаем тесты архива"
            EXCLUDE_GROUPS="archive"
          fi

          # Определяем список тестов для группы TEST_SCRIPT
          if [ -n "${TEST_SCRIPT}" ]
          then
            case "${TEST_SCRIPT}" in
              "Системные")
                TEST_LIST="CryptoProCertificateTest#verifyCryptoProPluginLoaded,CryptoProCertificateTest#testCertificateSelectionAndSigning,CryptoProCertificateTest#testPageDiagnostics,CryptoProCertificateTest#verifyCryptoProPluginWithStrategy,CryptoProCertificateTest#quickPluginCheck"
                ;;
              "Ручной ввод")
                TEST_LIST="Efs1#efs_szv_td,Efs1#efs_szv_staj,Efs1#efs_szv_td_krivonosov,Szv_td#szv_td,Szv_m#szv_m"
                ;;
              "Загрузка через XML")
                TEST_LIST="ReportXmlUploadTest#uploadReportViaXml,Efs1#efs_1_xml_krivonosov,Efs1#efs_1_xml_babkina,Szv_ish#szv_ish_xml"
                ;;
              *)
                TEST_LIST=""
                MAVEN_PROFILE="${TEST_SCRIPT}"
                ;;
            esac
          else
            TEST_LIST=""
            MAVEN_PROFILE=""
          fi

          # Если "Все ЛК", добавляем тесты архива к выбранным
          if [ "${LK_SCOPE}" = "Все ЛК" ] && [ -n "${TEST_LIST}" ]; then
            TEST_LIST="${TEST_LIST},${ARCHIVE_TESTS}"
          fi
        fi
      
        # Формируем команду Maven
        if [ -n "${TEST_LIST}" ]
        then
          echo "Running specific tests: ${TEST_LIST}"
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dtest="${TEST_LIST}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dtest="${TEST_LIST}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        elif [ -n "${MAVEN_PROFILE}" ]
        then
          echo "Using Maven profile: ${MAVEN_PROFILE}"
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${MAVEN_PROFILE}","${BROWSERS}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${MAVEN_PROFILE}","${BROWSERS}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        else
          echo "Running ALL tests without filtering (TEST_SCRIPT is empty)"
          if [ -n "${SUITE}" ]
          then
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -Dsuite="${SUITE}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          else
            MVN="mvn "$MAVEN_EXTRA" --activate-profiles "${ENVIRONMENT_OVERRIDE}","${BROWSERS}" -s settings.xml --batch-mode --errors --fail-at-end --show-version"
          fi
        fi

        # Исключаем группу archive для "ЛК Страхователя"
        if [ -n "${EXCLUDE_GROUPS}" ]; then
          MVN="${MVN} -DexcludedGroups=${EXCLUDE_GROUPS}"
        fi
        # Для ЛК Архива подставляем evs.ui.type=LKA (переопределяет профиль uat/test)
        if [ -n "${EVS_UI_TYPE_OVERRIDE}" ]; then
          MVN="${MVN} -Devs.ui.type=${EVS_UI_TYPE_OVERRIDE}"
        fi

        KUBE_CMD="kubectl port-forward --kubeconfig=/tmp/"${ENVIRONMENT_OVERRIDE}"-user.yaml --namespace="
      fi
    - cat hosts >> /etc/hosts
    - $(echo $KUBE_CMD"ps service/graphql-mesh-java 20266:20266") > /dev/null 2>&1 &
    - $(echo $KUBE_CMD"ps service/grpc-metadata 12099:12099") > /dev/null 2>&1 &
    - $(echo $KUBE_CMD"ps service/sequence 9090:9090") > /dev/null 2>&1 &
    - $(echo $KUBE_CMD"ps service/noble-registry-service 12089:12089") > /dev/null 2>&1 &
    - $(echo $KUBE_CMD"ps service/transact-manager 13000:13000") > /dev/null 2>&1 &
    - echo $MVN
    # Добавление сертификатов в хранилище java
    - cp ./src/test/resources/certs/java_cert.crt /usr/local/share/ca-certificates/
    - cp ./src/test/resources/certs/java_cert2.crt /usr/local/share/ca-certificates/
    - cp ./src/test/resources/certs/java_cert3.crt /usr/local/share/ca-certificates/
    - update-ca-certificates
    - keytool -import -v -cacerts -alias java_cert -file /usr/local/share/ca-certificates/java_cert.crt -storepass changeit -noprompt
    - keytool -import -v -cacerts -alias java_cert2 -file /usr/local/share/ca-certificates/java_cert2.crt -storepass changeit -noprompt
    - keytool -import -v -cacerts -alias java_cert3 -file /usr/local/share/ca-certificates/java_cert3.crt -storepass changeit -noprompt
    - |
      if [ -n "${SUITE}" ]
      then
        $MVN clean test -f pom.xml -Dspring.profiles.active=${ENVIRONMENT} -Dtm4j="true" -Dsuite="${SUITE}"
      else
        $MVN clean test -f pom.xml -Dspring.profiles.active=${ENVIRONMENT} -Dtm4j="true"
      fi
  artifacts:
    when: always
    paths:
      - "${TEST_ARTIFACTS}/site/allure-maven-plugin"
      - "${TEST_ARTIFACTS}/${REPORT_DIR_NAME}"
    expire_in: 24 hour

deploy report:
  stage: deploy
  image: "$CI_REGISTRY/tech/templates/base-images/tools:0.1.5"
  needs:
    - job: maven test
      artifacts: true
  allow_failure: true
  variables:
    ALLURE_SERVER: "allure-server.bft.local"
    OUTPUT_FILE:   "curl.post.result.out"
    DEL_RESULT:    "true"
  script:
    - |
      if [ ! -d "${TEST_ARTIFACTS}" ]; then
        echo "WARNING: ${TEST_ARTIFACTS} directory does not exist. Skipping report deployment."
        exit 0
      fi
    - cd "${TEST_ARTIFACTS}"
    - zip -r ${REPORT_DIR_NAME}.zip ./${REPORT_DIR_NAME}
    - curl -k --location -X POST "https://${ALLURE_SERVER}/api/result" --form allureResults="@${REPORT_DIR_NAME}.zip;type=application/zip" >> ${OUTPUT_FILE}
    - cat ${OUTPUT_FILE}
    - sed -i 's/{"fileName":"allure-results.zip","uuid":"//g' ${OUTPUT_FILE}
    - sed -i 's/"}//g' ${OUTPUT_FILE}
    - UUID=$(cat ${OUTPUT_FILE})
    - echo ${UUID}
    - >
      RESULT=$(curl -k --location -X POST "https://${ALLURE_SERVER}/api/report" \
        --header 'Content-Type: application/json' \
        --data-raw '{
          "reportSpec": {
            "path": [ "master", "'${CI_PIPELINE_ID}'" ],
            "executorInfo": { "buildName": "#'${CI_PIPELINE_ID}'" }
          },
          "results": [ "'${UUID}'" ],
          "deleteResults": "'${DEL_RESULT}'" }')
    - echo ${RESULT}
    - REPORT_URL=$(echo ${RESULT} | sed -n 's/.*"latest":"\([^"]*\)".*/\1/p')
    - cd ..
    - echo ${REPORT_URL} > ${DIR_NOTIFICATION}/report_link.txt
  artifacts:
    paths:
      - "${TEST_ARTIFACTS}/${REPORT_DIR_NAME}"
      - "${DIR_NOTIFICATION}/report_link.txt"
    expire_in: 24 hour
send_notif:
  stage: deploy
  image: "$CI_REGISTRY/tech/templates/base-images/maven:0.1.14"
  needs:
    - job: deploy report
      artifacts: true
  allow_failure: true
  script:
    - |
      if [ ! -f "${DIR_NOTIFICATION}/report_link.txt" ]; then
        echo "WARNING: report_link.txt not found. Skipping notification."
        exit 0
      fi
    - |
      if [ ! -d "${TEST_ARTIFACTS}/${REPORT_DIR_NAME}" ]; then
        echo "WARNING: ${TEST_ARTIFACTS}/${REPORT_DIR_NAME} directory does not exist. Skipping notification."
        exit 0
      fi
    - export TG_USER_NAME="@EVS_AQA_test_bot"
    - REPORT_URL=$(cat ${DIR_NOTIFICATION}/report_link.txt)
    - echo ${REPORT_URL}
    - NAME_SCRIPT=${TEST_SCRIPT}
    - apt-get update && apt-get install -y unzip
    - curl -sLo allure.zip https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.zip
    - unzip allure.zip -d /opt
    - export PATH=$PATH:/opt/allure-2.32.0/bin
    - allure generate ${TEST_ARTIFACTS}/${REPORT_DIR_NAME} -o ${REPORT_ARTIFACTS}/allure-report
    - |
      cd "${DIR_NOTIFICATION}"
      cat <<EOF > config.json
      {
        "base": {
          "project": "${NAME_SCRIPT}",
          "environment": "${ENVIRONMENT}",
          "comment": "Test run completed",
          "branch": "${CI_COMMIT_BRANCH}",
          "user": "${TG_USER_NAME}",
          "reportLink": "${REPORT_URL}",
          "language": "ru",
          "allureFolder": "${REPORT_ARTIFACTS}/allure-report/",
          "enableChart": true
        },
        "telegram": {
          "token": "7840400910:AAHMo5Lun2wKJjiRavjWEgy_h21KNFMl4uE",
          "chat": "-1002456904366",
          "replyTo": "@EVS_AQA_test_bot",
          "templatePath": "/templates/telegram.ftl"
        },
        "allure": {
        "reportPath": "/builds/ecp/evs-oi/evs-testing-framework/build/allure-report"
        }
      }
      EOF
    - cat config.json
    - cd ..
    - java "-DconfigFile=${DIR_NOTIFICATION}/config.json" -jar "${DIR_NOTIFICATION}/allure-notifications-4.8.0.jar"
    - rm -f ${DIR_NOTIFICATION}/config.json
    - rm -f ${DIR_NOTIFICATION}/report_link.txt
    - rm -rf ${REPORT_ARTIFACTS}/allure-report

lint helm:
  rules:
    - when: never

build helm:
  rules:
    - when: never

image build:
  rules:
    - when: never

sonarqube test:
  rules:
    - when: never

deploy helm:
  rules:
    - when: never

maven publish:
  rules:
    - when: never

cleanup helm:
  rules:
    - when: never